<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05080e">
<title>SENTINEL — Long Range Scanner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;width:100%;background:#05080e;overflow:hidden;
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }
  #c{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
  #sa{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<div id="sa"></div>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

/* ============================================================
   SENTINEL — a Defender-lineage rescue shooter, built for thumbs
   ============================================================ */

var cv  = document.getElementById('c');
var ctx = cv.getContext('2d', { alpha: false });
var saProbe = document.getElementById('sa');

/* ---------- palette: phosphor scanner, not neon arcade ---------- */
var C = {
  void1:'#05080e', void2:'#090f1b', void3:'#0d1526',
  hull:'#dff4ff', hullDim:'#7fb3cc', thrust:'#ffd27a',
  shot:'#fff8de',
  lander:'#b7ff3c', mutant:'#ff4fd8', bomber:'#ffab2e',
  pod:'#9b7bff', swarm:'#ff7d6b', baiter:'#ff2f4f',
  eshot:'#ff6a5c',
  human:'#ffd7a3',
  terra:'#1fd6a6', terraDead:'#5c4a52',
  hud:'#6f8bab', hudBright:'#cfe6ff',
  scan:'#0e2a33'
};

/* ---------- world constants (logical units) ---------- */
var W = 5200;                 // world circumference — it wraps
var TN = 340, TSTEP = W / TN; // terrain resolution
var terr = new Float32Array(TN);
var stars = [];

var VW = 0, VH = 0, SCALE = 1, DPR = 1;
var INSET = {t:0, r:0, b:0, l:0};
var HUD_H = 0, SKY_TOP = 0, GBASE = 0, TAMP = 44;
var bgGrad = null;

/* ---------- helpers ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function wrapX(x){ x %= W; return x<0 ? x+W : x; }
function wdx(a,b){ var d=a-b; d -= W*Math.round(d/W); return d; }
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

var seed = 20260731;
function srnd(){ seed = (seed*1664525+1013904223)>>>0; return seed/4294967296; }

/* ---------- terrain ---------- */
function buildTerrain(){
  seed = 20260731;
  for(var i=0;i<TN;i++){
    var a = i/TN*Math.PI*2;
    terr[i] = 0.42 + 0.20*Math.sin(a*3+1.1) + 0.13*Math.sin(a*7+2.3) + 0.08*Math.sin(a*13+0.7);
  }
  for(var k=0;k<30;k++){
    var c=(srnd()*TN)|0, wd=2+((srnd()*4)|0), amp=0.30+srnd()*0.55;
    for(var j=-wd;j<=wd;j++){
      var idx=((c+j)%TN+TN)%TN;
      terr[idx] = Math.min(1.3, terr[idx] + amp*(1-Math.abs(j)/(wd+1)));
    }
  }
  stars.length = 0;
  for(var s=0;s<230;s++){
    stars.push({ x: srnd()*W, y: srnd(), z: 0.25+srnd()*0.75, b: 0.2+srnd()*0.8 });
  }
}
function groundY(x){
  var f = wrapX(x)/TSTEP, i0=Math.floor(f), t=f-i0;
  var a = terr[i0%TN], b = terr[(i0+1)%TN];
  return GBASE - (a+(b-a)*t)*TAMP;
}

/* ---------- layout ---------- */
function readInsets(){
  try{
    var cs = getComputedStyle(saProbe);
    INSET.t = parseFloat(cs.paddingTop)||0;
    INSET.r = parseFloat(cs.paddingRight)||0;
    INSET.b = parseFloat(cs.paddingBottom)||0;
    INSET.l = parseFloat(cs.paddingLeft)||0;
  }catch(e){}
}
function resize(){
  var cw = window.innerWidth, ch = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width  = Math.max(1, Math.floor(cw*DPR));
  cv.height = Math.max(1, Math.floor(ch*DPR));
  cv.style.width = cw+'px'; cv.style.height = ch+'px';
  SCALE = clamp(Math.min(cw,ch)/380, 0.85, 2.4);
  VW = cw/SCALE; VH = ch/SCALE;
  readInsets();
  var it = INSET.t/SCALE, ib = INSET.b/SCALE;
  HUD_H  = it + 62;
  SKY_TOP = HUD_H + 4;
  GBASE  = VH - ib - 14;
  bgGrad = ctx.createLinearGradient(0,0,0,VH);
  bgGrad.addColorStop(0,   C.void1);
  bgGrad.addColorStop(0.55,C.void2);
  bgGrad.addColorStop(1,   C.void3);
  layoutButtons();
}
var BTN = { bomb:{x:0,y:0,r:27}, hyper:{x:0,y:0,r:23},
            mute:{x:0,y:0,r:15}, pause:{x:0,y:0,r:15}, auto:{x:0,y:0,r:15} };
function layoutButtons(){
  var ib = INSET.b/SCALE, ir = INSET.r/SCALE, it = INSET.t/SCALE;
  BTN.bomb.x  = VW - ir - 44; BTN.bomb.y  = VH - ib - 44;
  BTN.hyper.x = VW - ir - 44; BTN.hyper.y = VH - ib - 108;
  BTN.mute.x  = VW - ir - 20; BTN.mute.y  = it + 18;
  BTN.pause.x = VW - ir - 56; BTN.pause.y = it + 18;
  BTN.auto.x  = VW - ir - 92; BTN.auto.y  = it + 18;
}

/* ---------- audio ---------- */
var AC=null, master=null, muted=false, noiseBuf=null;
function initAudio(){
  if(AC) return;
  try{
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.16; master.connect(AC.destination);
    var n = AC.sampleRate*0.5; noiseBuf = AC.createBuffer(1,n,AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
  }catch(e){ AC=null; }
}
function resumeAudio(){ if(AC && AC.state==='suspended'){ AC.resume().catch(function(){}); } }
function tone(f1,f2,dur,type,vol){
  if(!AC||muted) return;
  var o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,AC.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.3,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008,AC.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function noise(dur,vol,freq){
  if(!AC||muted||!noiseBuf) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf;
  var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(freq||1400,AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(180,AC.currentTime+dur);
  var g=AC.createGain(); g.gain.setValueAtTime(vol||0.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008,AC.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(AC.currentTime+dur+0.02);
}
var SFX = {
  shot:  function(){ tone(rand(830,930),240,0.06,'square', AUTOFIRE?0.075:0.16); },
  hit:   function(){ noise(0.22,0.45,2200); },
  boom:  function(){ noise(0.55,0.7,900); tone(180,40,0.4,'sawtooth',0.2); },
  grab:  function(){ tone(300,760,0.18,'triangle',0.22); },
  save:  function(){ tone(520,1240,0.26,'triangle',0.3); },
  lost:  function(){ tone(300,90,0.5,'sawtooth',0.25); },
  bomb:  function(){ noise(0.7,0.8,3000); tone(120,30,0.6,'sawtooth',0.25); },
  warp:  function(){ tone(120,1600,0.3,'sine',0.25); },
  wave:  function(){ tone(440,880,0.12,'square',0.22); setTimeout(function(){tone(660,1320,0.18,'square',0.22);},130); },
  eshot: function(){ tone(220,120,0.09,'sawtooth',0.1); }
};

/* ---------- input ---------- */
var input = { sx:0, sy:0, fire:false };
var AUTOFIRE = true;   // on by default — frees the second thumb for flying
var stick = { on:false, id:null, ox:0, oy:0, cx:0, cy:0, r:44 };
var fireId = null, fireX=0, fireY=0;
var keys = {};

function toLogical(e){ return { x: e.clientX/SCALE, y: e.clientY/SCALE }; }
function inBtn(b,p){ var dx=p.x-b.x, dy=p.y-b.y; return dx*dx+dy*dy <= (b.r+10)*(b.r+10); }

function onDown(e){
  e.preventDefault();
  initAudio(); resumeAudio();
  var p = toLogical(e);

  if(inBtn(BTN.mute,p)){ muted=!muted; if(master) master.gain.value = muted?0:0.16; return; }
  if(inBtn(BTN.auto,p)){ toggleAutofire(); return; }

  if(G.screen==='title' || G.screen==='over'){ startRun(); return; }
  if(G.screen==='paused'){ G.screen='play'; return; }

  if(inBtn(BTN.pause,p)){ G.screen='paused'; return; }
  if(inBtn(BTN.bomb,p)){ fireSmartBomb(); return; }
  if(inBtn(BTN.hyper,p)){ hyperspace(); return; }

  // with autofire on, the first touch anywhere flies the ship — either thumb
  if(!stick.on && (p.x < VW*0.5 || AUTOFIRE)){
    stick.on=true; stick.id=e.pointerId; stick.ox=p.x; stick.oy=p.y; stick.cx=p.x; stick.cy=p.y;
  }else{
    fireId=e.pointerId; input.fire=true; fireX=p.x; fireY=p.y;
  }
}
function onMove(e){
  if(!stick.on || e.pointerId!==stick.id){
    if(fireId===e.pointerId){ var q=toLogical(e); fireX=q.x; fireY=q.y; }
    return;
  }
  var p = toLogical(e);
  var dx = p.x-stick.ox, dy = p.y-stick.oy;
  var d = Math.hypot(dx,dy);
  if(d > stick.r){ // drag the base along so the stick never runs out of travel
    stick.ox += dx*(1-stick.r/d); stick.oy += dy*(1-stick.r/d);
    dx = p.x-stick.ox; dy = p.y-stick.oy; d = stick.r;
  }
  stick.cx = p.x; stick.cy = p.y;
  input.sx = clamp(dx/stick.r,-1,1);
  input.sy = clamp(dy/stick.r,-1,1);
}
function onUp(e){
  if(stick.on && e.pointerId===stick.id){ stick.on=false; stick.id=null; input.sx=0; input.sy=0; }
  if(fireId===e.pointerId){ fireId=null; input.fire=false; }
}
cv.addEventListener('pointerdown', function(e){ try{cv.setPointerCapture(e.pointerId);}catch(x){} onDown(e); }, {passive:false});
cv.addEventListener('pointermove', onMove, {passive:false});
cv.addEventListener('pointerup', onUp, {passive:false});
cv.addEventListener('pointercancel', onUp, {passive:false});
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0) e.preventDefault();
  if(keys[e.code]) return;
  keys[e.code]=true;
  initAudio(); resumeAudio();
  if(e.code==='Enter'||e.code==='Space'){
    if(G.screen==='title'||G.screen==='over'){ startRun(); return; }
    if(G.screen==='paused'){ G.screen='play'; return; }
  }
  if(G.screen==='play'){
    if(e.code==='KeyB') fireSmartBomb();
    if(e.code==='KeyH') hyperspace();
    if(e.code==='KeyP') G.screen='paused';
  } else if(G.screen==='paused' && e.code==='KeyP'){ G.screen='play'; }
  if(e.code==='KeyM'){ muted=!muted; if(master) master.gain.value=muted?0:0.16; }
  if(e.code==='KeyF') toggleAutofire();
});
window.addEventListener('keyup', function(e){ keys[e.code]=false; });
document.addEventListener('visibilitychange', function(){ if(document.hidden && G.screen==='play') G.screen='paused'; });

function readKeys(){
  var kx=0, ky=0;
  if(keys.ArrowLeft||keys.KeyA) kx-=1;
  if(keys.ArrowRight||keys.KeyD) kx+=1;
  if(keys.ArrowUp||keys.KeyW) ky-=1;
  if(keys.ArrowDown||keys.KeyS) ky+=1;
  if(kx||ky){ input.sx=kx; input.sy=ky; }
  else if(!stick.on){ input.sx=0; input.sy=0; }
  if(keys.Space||keys.KeyJ) input.fire=true;
  else if(fireId===null) input.fire=false;
}

/* ---------- game state ---------- */
var G = {
  screen:'title', score:0, best:0, lives:0, bombs:0, wave:0,
  waveT:0, lastBaiter:0, banner:'', bannerT:0,
  planetDead:false, nextExtra:10000, shake:0, flash:0, camX:0, t:0
};
var P = null;
var enemies=[], bullets=[], eshots=[], mines=[], humans=[], parts=[], pops=[], queue=[];

/* persistent best score, if the host provides storage */
(function(){
  try{
    if(window.storage && window.storage.get){
      window.storage.get('sentinel:best').then(function(r){
        if(r && r.value){ var v=parseInt(r.value,10); if(!isNaN(v)) G.best=v; }
      }).catch(function(){});
    }
  }catch(e){}
})();
function saveBest(){
  try{ if(window.storage && window.storage.set) window.storage.set('sentinel:best', String(G.best)).catch(function(){}); }catch(e){}
}

function newPlayer(){
  return { x: W*0.5, y: (SKY_TOP+GBASE)*0.5, vx:0, vy:0, face:1,
           alive:true, inv:2.2, dead:0, cool:0, carry:null, warpCool:0 };
}
function startRun(){
  G.score=0; G.lives=3; G.bombs=3; G.wave=0; G.planetDead=false; G.nextExtra=10000;
  G.banner=''; G.bannerT=0; G.shake=0; G.flash=0;
  enemies.length=0; bullets.length=0; eshots.length=0; mines.length=0; parts.length=0; pops.length=0; queue.length=0;
  buildTerrain();
  P = newPlayer();
  G.camX = P.x;
  seedHumans(10);
  G.screen='play';
  nextWave();
}
function seedHumans(n){
  humans.length=0;
  for(var i=0;i<n;i++){
    var x = wrapX(W*(i+0.5)/n + rand(-120,120));
    humans.push({ x:x, y:groundY(x)-7, state:'walk', dir: Math.random()<0.5?-1:1, vy:0, carrier:null, fall0:0, t:rand(0,3) });
  }
}
function nextWave(){
  G.wave++;
  G.waveT=0; G.lastBaiter=0;
  queue.length=0;
  var n = G.wave;
  var landers = Math.min(5 + Math.floor(n*1.15), 14);
  var bombers = Math.min(1 + Math.floor(n/2), 6);
  var pods    = n>=3 ? Math.min(Math.floor(n/3), 4) : 0;
  var i;
  for(i=0;i<landers;i++) queue.push({t:0.35+i*0.5, k:'lander'});
  for(i=0;i<bombers;i++) queue.push({t:1.6+i*1.2, k:'bomber'});
  for(i=0;i<pods;i++)    queue.push({t:2.4+i*1.8, k:'pod'});
  if(G.wave>1) SFX.wave();
  banner('WAVE '+G.wave, 1.6);
  if(G.planetDead && G.wave%5===0){
    G.planetDead=false; seedHumans(8); banner('PLANET RESTORED · 8 COLONISTS', 2.2);
  }
}
function banner(txt,t){ G.banner=txt; G.bannerT=t; }
function difficulty(){ return Math.min(1 + (G.wave-1)*0.075, 2.2); }

function spawnX(){
  var side = Math.random()<0.5 ? -1 : 1;
  return wrapX(P.x + side*(VW*0.65 + Math.random()*W*0.3));
}
function spawn(kind, x, y){
  var e = { k:kind, x: x!==undefined?x:spawnX(), y: y!==undefined?y:rand(SKY_TOP+18, SKY_TOP+120),
            vx:0, vy:0, r:11, t:rand(0,6), fire:rand(1,3), human:null, target:null, ph:rand(0,6) };
  if(kind==='lander'){ e.r=11; e.vy=42; }
  else if(kind==='mutant'){ e.r=11; }
  else if(kind==='bomber'){ e.r=12; e.vx = (Math.random()<0.5?-1:1)*rand(34,52); e.y=rand(SKY_TOP+30, GBASE-90); }
  else if(kind==='pod'){ e.r=14; e.vx=rand(-22,22); e.vy=rand(-14,14); }
  else if(kind==='swarmer'){ e.r=7; }
  else if(kind==='baiter'){ e.r=11; e.y=rand(SKY_TOP+20, GBASE-70); }
  enemies.push(e);
  return e;
}

/* ---------- effects ---------- */
function boom(x,y,color,count,spd,big){
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2, s=rand(spd*0.25,spd);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.3,0.85),max:0.85,c:color,w:big?2.2:1.4});
  }
  G.shake = Math.min(14, G.shake + (big?9:3.5));
}
function popup(x,y,txt,color){ pops.push({x:x,y:y,txt:txt,c:color,life:1.1}); }

/* ---------- actions ---------- */
function toggleAutofire(){
  AUTOFIRE = !AUTOFIRE;
  if(!AUTOFIRE && fireId===null) input.fire=false;
  banner(AUTOFIRE ? 'AUTOFIRE ON · DRAG ANYWHERE TO FLY'
                  : 'AUTOFIRE OFF · HOLD RIGHT SIDE TO FIRE', 2.0);
  tone(AUTOFIRE?740:420, AUTOFIRE?1180:260, 0.12, 'square', 0.2);
}
function fireSmartBomb(){
  if(!P||!P.alive||G.bombs<=0) return;
  G.bombs--; G.flash=1; SFX.bomb();
  var killed=0;
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(Math.abs(wdx(e.x,G.camX)) < VW*0.62){ killEnemy(i,false); killed++; }
  }
  for(var j=mines.length-1;j>=0;j--){
    if(Math.abs(wdx(mines[j].x,G.camX)) < VW*0.62) mines.splice(j,1);
  }
  for(var k=eshots.length-1;k>=0;k--){
    if(Math.abs(wdx(eshots[k].x,G.camX)) < VW*0.62) eshots.splice(k,1);
  }
  if(killed) popup(P.x, P.y-26, killed+' CLEARED', C.hudBright);
}
function hyperspace(){
  if(!P||!P.alive||P.warpCool>0) return;
  P.warpCool=2.5;
  boom(P.x,P.y,C.hull,18,180,false);
  P.x = wrapX(P.x + rand(W*0.2, W*0.8));
  P.y = rand(SKY_TOP+40, GBASE-90);
  P.vx*=0.2; P.vy=0; P.inv=Math.max(P.inv,1.0);
  G.camX = P.x;
  SFX.warp();
  if(Math.random()<0.12){ killPlayer(); banner('WARP FAILURE', 1.4); }
}

function killEnemy(idx, byPlayer){
  var e = enemies[idx];
  var pts = 0;
  if(e.k==='lander'){ pts=150; boom(e.x,e.y,C.lander,12,150); }
  else if(e.k==='mutant'){ pts=150; boom(e.x,e.y,C.mutant,14,180); }
  else if(e.k==='bomber'){ pts=250; boom(e.x,e.y,C.bomber,14,160); }
  else if(e.k==='pod'){ pts=1000; boom(e.x,e.y,C.pod,18,140,true);
    var n=4+Math.min(3,Math.floor(G.wave/3));
    for(var i=0;i<n;i++){ var s=spawn('swarmer', wrapX(e.x+rand(-14,14)), e.y+rand(-14,14));
      var a=Math.random()*Math.PI*2; s.vx=Math.cos(a)*120; s.vy=Math.sin(a)*120; }
  }
  else if(e.k==='swarmer'){ pts=150; boom(e.x,e.y,C.swarm,8,140); }
  else if(e.k==='baiter'){ pts=200; boom(e.x,e.y,C.baiter,14,190); }

  if(e.human){ // dropped: it falls
    e.human.carrier=null; e.human.state='fall'; e.human.fall0=e.human.y; e.human.vy=0;
  }
  enemies.splice(idx,1);
  if(byPlayer){ addScore(pts); popup(e.x,e.y-16,String(pts),C.hudBright); }
  SFX.hit();
}
function addScore(n){
  G.score += n;
  if(G.score >= G.nextExtra){
    G.lives++; G.bombs++;
    G.nextExtra += (G.nextExtra>=25000 ? 25000 : 15000);
    banner('EXTRA SHIP + SMART BOMB', 1.8);
    SFX.save();
  }
}
function killPlayer(){
  if(!P.alive || P.inv>0) return;
  P.alive=false; P.dead=1.6;
  if(P.carry){ P.carry.state='fall'; P.carry.fall0=P.carry.y; P.carry.vy=0; P.carry=null; }
  boom(P.x,P.y,C.hull,34,240,true);
  G.flash=0.65; SFX.boom();
  G.lives--;
}

/* ---------- update ---------- */
function update(dt){
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt*26);
  G.flash = Math.max(0, G.flash - dt*2.2);
  if(G.bannerT>0) G.bannerT -= dt;

  if(G.screen!=='play') return;
  readKeys();

  G.waveT += dt;
  // staged spawns
  for(var q=queue.length-1;q>=0;q--){
    queue[q].t -= dt;
    if(queue[q].t<=0){ spawn(queue[q].k); queue.splice(q,1); }
  }
  // baiters punish dawdling
  if(queue.length===0 && enemies.length>0 && G.waveT>28 && G.waveT-G.lastBaiter>7){
    G.lastBaiter=G.waveT; spawn('baiter'); banner('BAITER INBOUND', 1.2);
  }
  if(queue.length===0 && enemies.length===0){
    var bonus = 100*G.wave + 200*humans.length;
    addScore(bonus);
    banner('WAVE CLEAR  +'+bonus, 2.0);
    nextWave();
  }

  updatePlayer(dt);
  updateEnemies(dt);
  updateHumans(dt);
  updateShots(dt);
  updateParts(dt);
  updateCamera(dt);

  if(G.lives<0){
    G.screen='over';
    if(G.score>G.best){ G.best=G.score; saveBest(); }
  }
}

function updatePlayer(dt){
  if(!P.alive){
    P.dead -= dt;
    if(P.dead<=0 && G.lives>=0){
      P = newPlayer();
      P.x = wrapX(G.camX); G.camX = P.x;
    }
    return;
  }
  P.inv = Math.max(0, P.inv-dt);
  P.cool = Math.max(0, P.cool-dt);
  P.warpCool = Math.max(0, P.warpCool-dt);

  var sx = input.sx, sy = input.sy;
  if(Math.abs(sx)>0.22) P.face = sx>0?1:-1;

  P.vx += sx*430*dt;
  P.vx *= Math.pow(Math.abs(sx)>0.05 ? 0.62 : 0.11, dt);
  P.vx = clamp(P.vx, -300, 300);

  var targetVy = sy*185;
  P.vy += (targetVy - P.vy) * (1 - Math.pow(0.0006, dt));

  P.x = wrapX(P.x + P.vx*dt);
  P.y += P.vy*dt;

  var gy = groundY(P.x)-9;
  if(P.y > gy){ P.y = gy; if(P.vy>0) P.vy = 0; }
  if(P.y < SKY_TOP+10){ P.y = SKY_TOP+10; if(P.vy<0) P.vy = 0; }

  // deliver a rescued colonist by touching down
  if(P.carry){
    P.carry.x = P.x; P.carry.y = P.y+13;
    if(P.y >= gy-2){
      var h=P.carry; h.state='walk'; h.carrier=null; h.y=groundY(h.x)-7; P.carry=null;
      addScore(500); popup(h.x,h.y-26,'RESCUED +500',C.human); SFX.save();
    }
  }

  if((input.fire || AUTOFIRE) && P.cool<=0){
    P.cool = 0.115;
    bullets.push({ x:wrapX(P.x+P.face*14), y:P.y, px:P.x, py:P.y,
                   vx:P.face*940 + P.vx*0.35, life:0.52 });
    SFX.shot();
  }
}

function nearestHuman(x){
  var best=null, bd=1e9;
  for(var i=0;i<humans.length;i++){
    var h=humans[i];
    if(h.state!=='walk') continue;
    var d=Math.abs(wdx(h.x,x));
    if(d<bd){ bd=d; best=h; }
  }
  return best;
}
function enemyShoot(e, spd, spread){
  if(!P.alive) return;
  var dx = wdx(P.x,e.x), dy = P.y-e.y, d = Math.hypot(dx,dy)||1;
  if(Math.abs(dx) > VW*0.62) return;
  var a = Math.atan2(dy,dx) + rand(-spread,spread);
  eshots.push({ x:e.x, y:e.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, life:2.6 });
  SFX.eshot();
}

function updateEnemies(dt){
  var D = difficulty();
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i]; e.t+=dt;

    if(e.k==='lander'){
      if(!e.human){
        if(!e.target || e.target.state!=='walk' || e.target.carrier) e.target = nearestHuman(e.x);
        if(e.target){
          var dx = wdx(e.target.x, e.x);
          e.vx = clamp(dx*1.4, -70, 70);
          e.vy = (e.y < e.target.y-6) ? 52*D*0.8 : 0;
          if(Math.abs(dx)<9 && Math.abs(e.target.y-e.y)<16){
            e.human=e.target; e.target.carrier=e; e.target.state='grab'; SFX.grab();
          }
        } else {
          e.vx = clamp(wdx(P.x,e.x)*0.5, -80, 80);
          e.vy = Math.sin(e.t*1.3)*34;
        }
      } else {
        e.vy = -50; e.vx = Math.sin(e.t*2.2)*22;
        e.human.x = e.x; e.human.y = e.y+13;
        if(e.y < SKY_TOP+14){
          var h=e.human; var hi=humans.indexOf(h); if(hi>=0) humans.splice(hi,1);
          e.human=null;
          boom(e.x,e.y,C.mutant,16,190,true);
          enemies.splice(i,1);
          spawn('mutant', e.x, SKY_TOP+22);
          SFX.lost();
          if(humans.length===0 && !G.planetDead) destroyPlanet();
          continue;
        }
      }
      e.fire-=dt*D;
      if(e.fire<=0){ e.fire=rand(1.6,3.4)/D; enemyShoot(e, 165*D, 0.16); }

    } else if(e.k==='mutant'){
      var mx = wdx(P.x,e.x), my = P.y-e.y, md = Math.hypot(mx,my)||1;
      e.vx += (mx/md*210 - e.vx)*dt*1.6 + Math.sin(e.t*7+e.ph)*22*dt*10;
      e.vy += (my/md*150 - e.vy)*dt*1.6 + Math.cos(e.t*9+e.ph)*18*dt*10;
      e.vx = clamp(e.vx,-215,215); e.vy = clamp(e.vy,-175,175);
      e.fire-=dt*D;
      if(e.fire<=0){ e.fire=rand(1.1,2.4)/D; enemyShoot(e, 195*D, 0.1); }

    } else if(e.k==='bomber'){
      e.vy = Math.sin(e.t*1.5+e.ph)*46;
      e.fire-=dt;
      if(e.fire<=0){
        e.fire=rand(1.1,2.0)/D;
        mines.push({x:e.x,y:e.y,vx:rand(-12,12),vy:rand(-8,18),life:9.5,ph:rand(0,6)});
      }

    } else if(e.k==='pod'){
      e.vx += Math.sin(e.t*0.7+e.ph)*10*dt*10;
      e.vy += Math.cos(e.t*0.5+e.ph)*8*dt*10;
      e.vx=clamp(e.vx,-40,40); e.vy=clamp(e.vy,-30,30);

    } else if(e.k==='swarmer'){
      var sxv = wdx(P.x,e.x), syv = P.y-e.y, sd=Math.hypot(sxv,syv)||1;
      e.vx += (sxv/sd*245 - e.vx)*dt*2.2;
      e.vy += (syv/sd*205 - e.vy)*dt*2.2;
      e.vx += Math.sin(e.t*11+e.ph)*40*dt;
      e.vy += Math.cos(e.t*13+e.ph)*40*dt;

    } else if(e.k==='baiter'){
      var bx = wdx(P.x,e.x), by = P.y-e.y;
      e.vx += (Math.sign(bx)*300 - e.vx)*dt*1.4;
      e.vy += (clamp(by*2.2,-160,160) - e.vy)*dt*2.4;
      e.fire-=dt*D;
      if(e.fire<=0){ e.fire=rand(0.9,1.7)/D; enemyShoot(e, 235*D, 0.07); }
    }

    e.x = wrapX(e.x + e.vx*dt);
    e.y += e.vy*dt;

    var eg = groundY(e.x)-e.r;
    if(e.y > eg){ e.y=eg; if(e.vy>0) e.vy = (e.k==='lander') ? 0 : -Math.abs(e.vy)*0.5; }
    if(e.y < SKY_TOP+8 && e.k!=='lander'){ e.y=SKY_TOP+8; if(e.vy<0) e.vy=Math.abs(e.vy)*0.5; }

    // contact with player
    if(P.alive && P.inv<=0){
      var cdx=wdx(e.x,P.x), cdy=e.y-P.y;
      if(cdx*cdx+cdy*cdy < (e.r+9)*(e.r+9)){ killPlayer(); killEnemy(i,false); continue; }
    }
  }

  // mines
  for(var m=mines.length-1;m>=0;m--){
    var mn=mines[m]; mn.life-=dt;
    mn.x=wrapX(mn.x+mn.vx*dt); mn.y+=mn.vy*dt;
    var mg=groundY(mn.x)-4; if(mn.y>mg){ mn.y=mg; mn.vy=-Math.abs(mn.vy)*0.3; }
    if(mn.life<=0){ mines.splice(m,1); continue; }
    if(P.alive && P.inv<=0){
      var mdx=wdx(mn.x,P.x), mdy=mn.y-P.y;
      if(mdx*mdx+mdy*mdy < 13*13){ killPlayer(); boom(mn.x,mn.y,C.bomber,10,140); mines.splice(m,1); }
    }
  }
}

function destroyPlanet(){
  G.planetDead=true;
  G.flash=1; G.shake=18; SFX.boom();
  banner('COLONY LOST — SURFACE BURNED', 2.6);
  for(var i=0;i<enemies.length;i++){
    if(enemies[i].k==='lander'){ enemies[i].k='mutant'; enemies[i].human=null; }
  }
  for(var k=0;k<70;k++){
    var x = wrapX(G.camX + rand(-VW*0.6, VW*0.6));
    boom(x, groundY(x)-rand(0,20), C.bomber, 3, 120);
  }
}

function updateHumans(dt){
  for(var i=humans.length-1;i>=0;i--){
    var h=humans[i];
    if(h.state==='walk'){
      h.t-=dt;
      if(h.t<=0){ h.t=rand(1.2,3.2); h.dir = Math.random()<0.4 ? -h.dir : h.dir; }
      h.x = wrapX(h.x + h.dir*11*dt);
      h.y = groundY(h.x)-7;
      // player scoops a walker? no — only falling ones. Keep grounded.
    } else if(h.state==='fall'){
      h.vy += 210*dt;
      h.y += h.vy*dt;
      // caught by ship
      if(P.alive && !P.carry){
        var dx=wdx(h.x,P.x), dy=h.y-P.y;
        if(dx*dx+dy*dy < 20*20){
          P.carry=h; h.state='held'; addScore(250); popup(h.x,h.y-20,'CAUGHT +250',C.human); SFX.grab();
          continue;
        }
      }
      var gy=groundY(h.x)-7;
      if(h.y>=gy){
        if(gy - h.fall0 > 150){ // fell too far
          boom(h.x,gy,C.human,10,120); humans.splice(i,1); SFX.lost();
          if(humans.length===0 && !G.planetDead) destroyPlanet();
          continue;
        }
        h.y=gy; h.state='walk'; h.vy=0;
      }
    }
  }
}

function segCircle(x1,y1,x2,y2,cx,cy,r){
  var dx=x2-x1, dy=y2-y1;
  var fx=cx-x1, fy=cy-y1;
  var len2=dx*dx+dy*dy;
  var t = len2>0 ? clamp((fx*dx+fy*dy)/len2,0,1) : 0;
  var px=x1+dx*t, py=y1+dy*t;
  var ddx=cx-px, ddy=cy-py;
  return ddx*ddx+ddy*ddy <= r*r;
}

function updateShots(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    b.px=b.x; b.py=b.y;
    b.x=wrapX(b.x+b.vx*dt); b.life-=dt;
    if(b.life<=0){ bullets.splice(i,1); continue; }
    var rel = wdx(b.x, b.px);      // small signed step, wrap safe
    var hit=false;
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j];
      var ex = wdx(e.x,b.px), ey = e.y-b.py;
      if(segCircle(0,0,rel,0, ex,ey, e.r+4)){ killEnemy(j,true); hit=true; break; }
    }
    if(hit){ bullets.splice(i,1); continue; }
    for(var m=mines.length-1;m>=0;m--){
      var mn=mines[m];
      var mx=wdx(mn.x,b.px), my=mn.y-b.py;
      if(segCircle(0,0,rel,0, mx,my, 8)){ boom(mn.x,mn.y,C.bomber,8,130); mines.splice(m,1); addScore(25); hit=true; break; }
    }
    if(hit) bullets.splice(i,1);
  }

  for(var s=eshots.length-1;s>=0;s--){
    var t2=eshots[s];
    t2.x=wrapX(t2.x+t2.vx*dt); t2.y+=t2.vy*dt; t2.life-=dt;
    if(t2.life<=0 || t2.y>groundY(t2.x) || t2.y<SKY_TOP){ eshots.splice(s,1); continue; }
    if(P.alive && P.inv<=0){
      var dx=wdx(t2.x,P.x), dy=t2.y-P.y;
      if(dx*dx+dy*dy < 11*11){ eshots.splice(s,1); killPlayer(); }
    }
  }
}

function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.x=wrapX(p.x+p.vx*dt); p.y+=p.vy*dt;
    p.vx*=Math.pow(0.25,dt); p.vy=p.vy*Math.pow(0.25,dt)+70*dt;
  }
  for(var k=pops.length-1;k>=0;k--){
    pops[k].life-=dt; pops[k].y-=22*dt;
    if(pops[k].life<=0) pops.splice(k,1);
  }
}

function updateCamera(dt){
  var lead = VW*0.20;
  var want = P.x + (P.alive? P.face*lead : 0);
  var d = wdx(want, G.camX);
  G.camX = wrapX(G.camX + d*(1-Math.pow(0.0025,dt)));
}

/* ---------- rendering ---------- */
function sx(x){ return VW*0.5 + wdx(x, G.camX); }
function visible(x, pad){ return Math.abs(wdx(x,G.camX)) < VW*0.5 + (pad||30); }

function stroke2(color, w, alpha){
  ctx.strokeStyle = color;
  ctx.globalAlpha = (alpha===undefined?0.22:alpha);
  ctx.lineWidth = w*3.2; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = w; ctx.stroke();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = C.void1;
  ctx.fillRect(0,0,cv.width/DPR,cv.height/DPR);

  var shx = G.shake ? rand(-G.shake,G.shake) : 0;
  var shy = G.shake ? rand(-G.shake,G.shake) : 0;
  ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE, shx*DPR, shy*DPR);

  ctx.fillStyle = bgGrad || C.void1;
  ctx.fillRect(-20,-20,VW+40,VH+40);

  drawStars();
  drawTerrain();
  drawHumans();
  drawMines();
  drawEnemies();
  drawShots();
  drawParts();
  if(P && P.alive) drawShip(P.x,P.y,P.face,1,(P.inv>0 && Math.floor(G.t*14)%2===0)?C.hullDim:C.hull);
  drawPops();

  ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,0,0);
  drawHUD();
  drawControls();
  drawScreens();

  if(G.flash>0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle = 'rgba(255,255,255,'+(G.flash*0.55)+')';
    ctx.fillRect(0,0,cv.width/DPR,cv.height/DPR);
  }
}

function drawStars(){
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    var px = VW*0.5 + wdx(s.x,G.camX)*s.z;
    px = ((px % VW)+VW)%VW;
    var py = SKY_TOP + s.y*(GBASE-SKY_TOP-30);
    ctx.globalAlpha = s.b*0.55;
    ctx.fillStyle = s.z>0.7 ? '#cfe6ff' : '#5f7ea6';
    ctx.fillRect(px, py, s.z>0.8?1.6:1.1, s.z>0.8?1.6:1.1);
  }
  ctx.globalAlpha=1;
}

function drawTerrain(){
  var col = G.planetDead ? C.terraDead : C.terra;
  var left = G.camX - VW*0.5;
  var base = Math.floor(left/TSTEP)-1;
  var count = Math.ceil(VW/TSTEP)+3;
  ctx.beginPath();
  for(var i=0;i<=count;i++){
    var idx=base+i;
    var wx=idx*TSTEP;
    var px=wx-left;
    var h=terr[((idx%TN)+TN)%TN];
    var py=GBASE-h*TAMP;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.lineTo(VW+TSTEP, VH+20); ctx.lineTo(-TSTEP, VH+20); ctx.closePath();
  ctx.fillStyle = G.planetDead ? 'rgba(92,74,82,0.16)' : 'rgba(31,214,166,0.10)';
  ctx.fill();

  ctx.beginPath();
  for(var j=0;j<=count;j++){
    var id2=base+j, wx2=id2*TSTEP, px2=wx2-left;
    var h2=terr[((id2%TN)+TN)%TN], py2=GBASE-h2*TAMP;
    if(j===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2);
  }
  ctx.lineCap='round'; ctx.lineJoin='round';
  stroke2(col, 1.8, 0.20);
}

function drawHumans(){
  for(var i=0;i<humans.length;i++){
    var h=humans[i];
    if(!visible(h.x,20)) continue;
    var x=sx(h.x), y=h.y;
    ctx.beginPath();
    ctx.moveTo(x, y-4); ctx.lineTo(x, y+2);
    ctx.moveTo(x-3.2, y-1); ctx.lineTo(x+3.2, y-1);
    ctx.moveTo(x, y+2); ctx.lineTo(x-2.6, y+6);
    ctx.moveTo(x, y+2); ctx.lineTo(x+2.6, y+6);
    stroke2(C.human, 1.5, 0.25);
    ctx.beginPath(); ctx.arc(x, y-6.2, 1.9, 0, 6.2832);
    ctx.fillStyle=C.human; ctx.fill();
  }
}

function drawMines(){
  for(var i=0;i<mines.length;i++){
    var m=mines[i];
    if(!visible(m.x,20)) continue;
    var x=sx(m.x), y=m.y, a=G.t*2.5+m.ph;
    ctx.beginPath();
    for(var k=0;k<4;k++){
      var ang=a+k*Math.PI/2;
      ctx.moveTo(x+Math.cos(ang)*2, y+Math.sin(ang)*2);
      ctx.lineTo(x+Math.cos(ang)*6.5, y+Math.sin(ang)*6.5);
    }
    stroke2(C.bomber, 1.4, 0.25);
    ctx.beginPath(); ctx.arc(x,y,2.2,0,6.2832);
    ctx.fillStyle = (Math.floor(G.t*6)%2) ? C.bomber : '#ffe6b8'; ctx.fill();
  }
}

function drawShip(wx,wy,face,scl,color){
  var x=sx(wx), y=wy;
  ctx.save(); ctx.translate(x,y); ctx.scale(face*scl, scl);
  ctx.beginPath();
  ctx.moveTo(15,0); ctx.lineTo(4,-4); ctx.lineTo(-6,-6); ctx.lineTo(-13,-3);
  ctx.lineTo(-13,3); ctx.lineTo(-6,6); ctx.lineTo(4,4); ctx.closePath();
  stroke2(color, 1.7, 0.28);
  ctx.beginPath(); ctx.moveTo(-6,-6); ctx.lineTo(-2,0); ctx.lineTo(-6,6);
  stroke2(color, 1.1, 0.15);
  ctx.beginPath(); ctx.arc(6,0,1.8,0,6.2832); ctx.fillStyle='#ffffff'; ctx.fill();
  if(P && P.alive && Math.abs(input.sx)>0.22){
    var f = 6+Math.random()*9;
    ctx.beginPath(); ctx.moveTo(-13,-2.4); ctx.lineTo(-13-f,0); ctx.lineTo(-13,2.4); ctx.closePath();
    ctx.fillStyle=C.thrust; ctx.globalAlpha=0.85; ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.restore();
  if(P && P.carry && wx===P.x){
    ctx.beginPath(); ctx.moveTo(x, y+6); ctx.lineTo(x, y+11);
    stroke2(C.human, 1.1, 0.2);
  }
}

function drawEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!visible(e.x,30)) continue;
    var x=sx(e.x), y=e.y;
    ctx.save(); ctx.translate(x,y);
    if(e.k==='lander'){
      ctx.beginPath();
      ctx.moveTo(-7,-6); ctx.lineTo(7,-6); ctx.lineTo(9,2); ctx.lineTo(-9,2); ctx.closePath();
      ctx.moveTo(-6,2); ctx.lineTo(-9,9); ctx.moveTo(6,2); ctx.lineTo(9,9);
      ctx.moveTo(0,-6); ctx.lineTo(0,-10);
      stroke2(C.lander,1.5,0.25);
      ctx.beginPath(); ctx.arc(0,-11,1.8,0,6.2832); ctx.fillStyle=C.lander; ctx.fill();
      if(e.human){ ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(0,11); stroke2(C.human,1,0.2); }
    } else if(e.k==='mutant'){
      ctx.beginPath();
      for(var k=0;k<7;k++){
        var a=e.t*3 + k*(Math.PI*2/7);
        var r=(k%2? 5.5:11) + Math.sin(e.t*9+k)*1.4;
        var px=Math.cos(a)*r, py=Math.sin(a)*r;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); stroke2(C.mutant,1.5,0.3);
    } else if(e.k==='bomber'){
      ctx.beginPath();
      for(var h=0;h<6;h++){
        var ha=h*Math.PI/3 + Math.PI/6;
        var hx=Math.cos(ha)*11, hy=Math.sin(ha)*9;
        if(h===0) ctx.moveTo(hx,hy); else ctx.lineTo(hx,hy);
      }
      ctx.closePath();
      ctx.moveTo(-6,0); ctx.lineTo(6,0); ctx.moveTo(0,-5); ctx.lineTo(0,5);
      stroke2(C.bomber,1.5,0.25);
    } else if(e.k==='pod'){
      ctx.beginPath(); ctx.arc(0,0,12,0,6.2832); stroke2(C.pod,1.6,0.28);
      ctx.beginPath(); ctx.arc(0,0,6+Math.sin(e.t*5)*1.6,0,6.2832); stroke2(C.pod,1.2,0.22);
    } else if(e.k==='swarmer'){
      ctx.rotate(Math.atan2(e.vy,e.vx));
      ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-5,-4.5); ctx.lineTo(-5,4.5); ctx.closePath();
      stroke2(C.swarm,1.3,0.3);
    } else if(e.k==='baiter'){
      ctx.scale(e.vx<0?-1:1,1);
      ctx.beginPath();
      ctx.moveTo(13,0); ctx.lineTo(0,-6); ctx.lineTo(-11,-2); ctx.lineTo(-11,2); ctx.lineTo(0,6); ctx.closePath();
      stroke2(C.baiter,1.6,0.32);
      ctx.beginPath(); ctx.arc(4,0,1.6,0,6.2832); ctx.fillStyle='#fff'; ctx.fill();
    }
    ctx.restore();
  }
}

function drawShots(){
  for(var i=0;i<bullets.length;i++){
    var b=bullets[i];
    if(!visible(b.x,60)) continue;
    var x=sx(b.x), len = b.vx>0? -26 : 26;
    ctx.beginPath(); ctx.moveTo(x, b.y); ctx.lineTo(x+len, b.y);
    stroke2(C.shot, 2, 0.3);
  }
  for(var j=0;j<eshots.length;j++){
    var s=eshots[j];
    if(!visible(s.x,30)) continue;
    var ex=sx(s.x);
    ctx.beginPath(); ctx.moveTo(ex,s.y); ctx.lineTo(ex - s.vx*0.022, s.y - s.vy*0.022);
    stroke2(C.eshot, 2, 0.3);
  }
}

function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(!visible(p.x,40)) continue;
    var a = clamp(p.life/p.max,0,1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    var x=sx(p.x);
    ctx.fillRect(x-p.w*0.5, p.y-p.w*0.5, p.w, p.w);
  }
  ctx.globalAlpha=1;
}

function drawPops(){
  ctx.textAlign='center';
  ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  for(var i=0;i<pops.length;i++){
    var p=pops[i];
    if(!visible(p.x,60)) continue;
    ctx.globalAlpha = clamp(p.life,0,1);
    ctx.fillStyle = p.c;
    ctx.fillText(p.txt, sx(p.x), p.y);
  }
  ctx.globalAlpha=1;
}

/* ---------- HUD + the signature long-range scanner ---------- */
function drawHUD(){
  var it = INSET.t/SCALE, il = INSET.l/SCALE, ir = INSET.r/SCALE;
  var top = it + 4;

  // scanner frame
  var sxp = il + 10, sw = VW - il - ir - 20, sh = 34, syp = top + 20;
  if(sw > 120){
    drawScanner(sxp, syp, sw, sh);
  }

  ctx.font='600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=C.hud;
  ctx.fillText('SCORE', sxp, top+12);
  ctx.fillStyle=C.hudBright;
  ctx.font='700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.fillText(String(G.score).padStart(6,'0'), sxp+40, top+13);

  // ships + bombs
  var nl = Math.min(G.lives,5), nb = Math.min(G.bombs,5);
  var bx = sxp+118;
  for(var i=0;i<nl;i++){
    ctx.save(); ctx.translate(bx+i*12, top+8); ctx.scale(0.40,0.40);
    ctx.beginPath();
    ctx.moveTo(15,0); ctx.lineTo(4,-4); ctx.lineTo(-6,-6); ctx.lineTo(-13,-3);
    ctx.lineTo(-13,3); ctx.lineTo(-6,6); ctx.lineTo(4,4); ctx.closePath();
    ctx.strokeStyle=C.hull; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
  }
  var mx = bx + nl*12 + 10;
  for(var m=0;m<nb;m++){
    ctx.beginPath(); ctx.arc(mx+m*10, top+8, 3.2, 0, 6.2832);
    ctx.strokeStyle=C.bomber; ctx.lineWidth=1.4; ctx.stroke();
  }

  // chips: autofire, sound, pause
  chip(BTN.auto, 'AF', AUTOFIRE?C.shot:C.hud, AUTOFIRE);
  chip(BTN.mute, muted?'✕':'♪', muted?C.hud:C.hudBright, false);
  if(G.screen==='play') chip(BTN.pause, '❚❚', C.hud, false);

  // banner
  if(G.bannerT>0){
    ctx.textAlign='center';
    ctx.globalAlpha = clamp(G.bannerT,0,1);
    ctx.fillStyle=C.hudBright;
    ctx.font='700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText(G.banner, VW*0.5, HUD_H+34);
    ctx.globalAlpha=1;
  }
}
function chip(b, glyph, color, active){
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.2832);
  if(active){ ctx.fillStyle='rgba(255,248,222,0.12)'; ctx.fill(); }
  ctx.strokeStyle = active ? 'rgba(255,248,222,0.55)' : 'rgba(111,139,171,0.35)';
  ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='600 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.fillText(glyph, b.x, b.y+0.5);
  ctx.textBaseline='alphabetic';
}

function drawScanner(x,y,w,h){
  ctx.fillStyle='rgba(14,42,51,0.55)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(31,214,166,0.30)'; ctx.lineWidth=1;
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);

  var k = w/W;                          // world → scanner
  var cxp = x + w*0.5;
  var pxp = P ? P.x : 0;
  function mx(wx){ return cxp + wdx(wx, pxp)*k; }

  // miniature horizon
  ctx.beginPath();
  var pts=96;
  for(var i=0;i<=pts;i++){
    var wx = pxp - W*0.5 + (i/pts)*W;
    var f = wrapX(wx)/TSTEP, i0=Math.floor(f)%TN;
    var hh = terr[i0];
    var px = x + (i/pts)*w, py = y+h-3 - hh*7;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.strokeStyle = G.planetDead? 'rgba(92,74,82,0.6)':'rgba(31,214,166,0.45)';
  ctx.lineWidth=1; ctx.stroke();

  // sweep line — slow phosphor pass
  var sweep = x + ((G.t*0.32)%1)*w;
  var grad = ctx.createLinearGradient(sweep-26,0,sweep,0);
  grad.addColorStop(0,'rgba(31,214,166,0)');
  grad.addColorStop(1,'rgba(31,214,166,0.18)');
  ctx.fillStyle=grad; ctx.fillRect(sweep-26, y+1, 26, h-2);

  // contacts
  function blip(wx,wy,color,size){
    var px=mx(wx);
    if(px<x+1||px>x+w-1) return;
    var py = y+3 + ((wy-SKY_TOP)/(GBASE-SKY_TOP))*(h-7);
    ctx.fillStyle=color; ctx.fillRect(px-size*0.5, clamp(py,y+2,y+h-3)-size*0.5, size, size);
  }
  for(var a=0;a<humans.length;a++) blip(humans[a].x, humans[a].y, C.human, 2);
  for(var b=0;b<enemies.length;b++){
    var e=enemies[b];
    blip(e.x, e.y, e.k==='lander'?C.lander : e.k==='mutant'?C.mutant : e.k==='bomber'?C.bomber :
                   e.k==='pod'?C.pod : e.k==='swarmer'?C.swarm : C.baiter, 3);
  }
  for(var c=0;c<mines.length;c++) blip(mines[c].x, mines[c].y, 'rgba(255,171,46,0.7)', 2);
  if(P && P.alive) blip(P.x, P.y, '#ffffff', 4);

  // viewport brackets
  var half = (VW*0.5)*k, vc = cxp + wdx(G.camX,pxp)*k;
  ctx.strokeStyle='rgba(207,230,255,0.5)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(vc-half, y+2); ctx.lineTo(vc-half, y+h-2);
  ctx.moveTo(vc+half, y+2); ctx.lineTo(vc+half, y+h-2);
  ctx.stroke();

  // tactical readout lives on the tactical display
  ctx.font='600 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.globalAlpha=0.6;
  ctx.textAlign='left';  ctx.fillStyle=C.hud;  ctx.fillText('WAVE '+G.wave, x+5, y+9);
  ctx.textAlign='right'; ctx.fillStyle=C.human; ctx.fillText(humans.length+' COLONISTS', x+w-5, y+9);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ---------- on-screen controls ---------- */
function drawControls(){
  if(G.screen!=='play') return;

  // floating stick
  if(stick.on){
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, stick.r, 0, 6.2832);
    ctx.strokeStyle='rgba(207,230,255,0.18)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, stick.r*0.62, 0, 6.2832);
    ctx.strokeStyle='rgba(207,230,255,0.10)'; ctx.stroke();
    var kx = stick.ox + input.sx*stick.r, ky = stick.oy + input.sy*stick.r;
    ctx.beginPath(); ctx.arc(kx, ky, 17, 0, 6.2832);
    ctx.fillStyle='rgba(223,244,255,0.16)'; ctx.fill();
    ctx.strokeStyle='rgba(223,244,255,0.5)'; ctx.lineWidth=1.4; ctx.stroke();
  } else {
    var hy = VH - INSET.b/SCALE - 54, hx = INSET.l/SCALE + 54;
    ctx.globalAlpha = 0.16 + Math.sin(G.t*2)*0.04;
    ctx.beginPath(); ctx.arc(hx,hy,30,0,6.2832);
    ctx.strokeStyle=C.hudBright; ctx.lineWidth=1.2; ctx.setLineDash([4,6]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=C.hudBright; ctx.textAlign='center';
    ctx.font='600 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText('DRAG', hx, hy+3);
    ctx.globalAlpha=1;
  }

  // fire feedback
  if(input.fire && fireId!==null){
    ctx.beginPath(); ctx.arc(fireX, fireY, 26+Math.sin(G.t*30)*3, 0, 6.2832);
    ctx.strokeStyle='rgba(255,248,222,0.35)'; ctx.lineWidth=1.6; ctx.stroke();
  }

  // bomb + hyperspace
  padButton(BTN.bomb, 'BOMB', String(G.bombs), G.bombs>0?C.bomber:C.hud);
  padButton(BTN.hyper, 'WARP', P&&P.warpCool>0?'…':'▲', (P&&P.warpCool>0)?C.hud:C.pod);
}
function padButton(b, label, glyph, color){
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.2832);
  ctx.fillStyle='rgba(9,15,27,0.55)'; ctx.fill();
  ctx.strokeStyle=color; ctx.globalAlpha=0.55; ctx.lineWidth=1.4; ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=color; ctx.textAlign='center';
  ctx.font='700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.fillText(glyph, b.x, b.y+1);
  ctx.font='600 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.globalAlpha=0.7; ctx.fillText(label, b.x, b.y+b.r+10); ctx.globalAlpha=1;
}

/* ---------- title / pause / game over ---------- */
function drawScreens(){
  if(G.screen==='play') return;
  ctx.fillStyle='rgba(5,8,14,0.80)';
  ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';

  var cy = VH*0.5;
  if(G.screen==='title'){
    ctx.save();
    ctx.translate(VW*0.5, cy-90);
    ctx.scale(1.5,1);
    ctx.fillStyle=C.hudBright;
    ctx.font='700 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText('SENTINEL', 0, 0);
    ctx.restore();

    ctx.fillStyle=C.terra;
    ctx.font='600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText('L O N G   R A N G E   S C A N N E R', VW*0.5, cy-66);

    ctx.fillStyle=C.hud;
    ctx.font='500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    var lines = [
      'Landers are dragging colonists off the surface.',
      'Shoot the lander, catch the falling colonist,',
      'fly down and set them back on the ground.',
      '',
      'DRAG ANYWHERE to fly — guns run themselves',
      'AF chip up top turns autofire off (F on desktop)',
      'BOMB clears the screen  ·  WARP jumps you away',
      '',
      'Let every colonist go and the surface burns.'
    ];
    for(var i=0;i<lines.length;i++) ctx.fillText(lines[i], VW*0.5, cy-34+i*17);

    ctx.fillStyle=C.hudBright;
    ctx.font='700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.globalAlpha = 0.55+Math.sin(G.t*4)*0.45;
    ctx.fillText('TAP TO LAUNCH', VW*0.5, cy+128);
    ctx.globalAlpha=1;
    if(G.best>0){
      ctx.fillStyle=C.hud;
      ctx.font='500 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      ctx.fillText('BEST '+G.best, VW*0.5, cy+152);
    }
  } else if(G.screen==='paused'){
    ctx.fillStyle=C.hudBright;
    ctx.font='700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText('PAUSED', VW*0.5, cy-6);
    ctx.fillStyle=C.hud;
    ctx.font='500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText('Tap to resume', VW*0.5, cy+18);
  } else if(G.screen==='over'){
    ctx.fillStyle=C.baiter;
    ctx.font='700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText('SHIPS LOST', VW*0.5, cy-46);
    ctx.fillStyle=C.hudBright;
    ctx.font='700 30px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText(String(G.score), VW*0.5, cy-6);
    ctx.fillStyle=C.hud;
    ctx.font='500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText('reached wave '+G.wave+'  ·  best '+G.best, VW*0.5, cy+18);
    ctx.fillStyle=C.hudBright;
    ctx.font='700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.globalAlpha=0.55+Math.sin(G.t*4)*0.45;
    ctx.fillText('TAP TO FLY AGAIN', VW*0.5, cy+56);
    ctx.globalAlpha=1;
  }
}

/* ---------- loop ---------- */
var last = 0;
function frame(ts){
  if(!last) last = ts;
  var dt = Math.min((ts-last)/1000, 0.033);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
window.addEventListener('resize', function(){ resize(); });
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });
resize();
buildTerrain();
P = newPlayer();
G.camX = P.x;
seedHumans(10);
requestAnimationFrame(frame);

})();
</script>
