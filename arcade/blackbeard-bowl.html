for(const el of document.querySelectorAll('[data-key]')){let k=el.dataset.key;el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('held');keyDown(k)};el.onpointerup=e=>{el.classList.remove('held');keyUp(k)};el.onpointercancel=()=>{el.classList.remove('held');pressed.delete(k);aTime=null}}
const pad=document.querySelector('#pad');let finger=null,padDir='';
function padTouch(e){const r=pad.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width*2-1,dy=(e.clientY-r.top)/r.height*2-1;padVec=[Math.abs(dx)>.18?dx:0,Math.abs(dy)>.18?dy:0];let m=Math.hypot(...padVec);if(m>.18)padVec=padVec.map(v=>v/m);let k=m<=.18?'':Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up';if(k&&k!==padDir)navMove(k);padDir=k;['up','down','left','right'].forEach((a,i)=>pad.children[i].classList.toggle('on',a===k))}
pad.onpointerdown=e=>{if(finger!==null)return;unlock();finger=e.pointerId;pad.setPointerCapture(finger);padTouch(e)};pad.onpointermove=e=>{if(e.pointerId===finger)padTouch(e)};pad.onpointerup=pad.onpointercancel=e=>{if(e.pointerId===finger){finger=null;padVec=[0,0];padDir='';[...pad.children].forEach(s=>s.classList.remove('on'))}};
document.querySelector('#start').onclick=()=>{keyDown('start');keyUp('start')};document.querySelector('#mute').onclick=e=>{unlock();quiet=!quiet;e.target.textContent=quiet?'SOUND OFF':'SOUND ON';if(!quiet)tone()};
function suspend(){pressed.clear();padVec=[0,0];aTime=null;if(['live','kick','dead'].includes(scene))pause()}document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend()});window.addEventListener('blur',suspend);
function step(dt){anim+=dt;if(scene==='live'){if(aTime!==null&&aTime>=0){aTime+=dt;if(aTime>=.23&&!pos&&!passUsed&&offCall>=2&&!returnPlay){actionA(true);aTime=-1}}updateLive(dt)}else if(scene==='kick')updateKick(dt);else if(scene==='dead'){wait-=dt;if(wait<=0)advance()}}
let last=0,acc=0,painted='';function frame(now){acc+=Math.min((now-(last||now))/1000,.08);last=now;while(acc>=1/60){step(1/60);acc-=1/60}if(scene!==painted||scene==='kick'||scene==='live'){draw();painted=scene}requestAnimationFrame(frame)}
updateHint();draw();requestAnimationFrame(frame);
</script></body></html>
